name: Application CI

on:
  push:
    branches:
      - main
    paths: 
      - 'app/**'
      - '.github/workflows/ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate application
        working-directory: app
        run: npm test
